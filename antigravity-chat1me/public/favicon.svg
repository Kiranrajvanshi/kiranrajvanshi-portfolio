<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="kr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="#0b0d13" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="6" y="6" width="88" height="88" rx="22" stroke="url(#kr-grad)" stroke-width="2" opacity="0.6"/>
  <text x="50" y="62" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="40" fill="url(#kr-grad)" text-anchor="middle" filter="url(#glow)">KR</text>
</svg>
