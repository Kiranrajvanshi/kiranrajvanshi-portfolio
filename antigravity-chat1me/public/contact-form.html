<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>Contact Form</title></head>
  <body>
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">
      <p style="position:absolute;overflow:hidden;clip:rect(0 0 0 0);height:1px;width:1px;margin:-1px;padding:0;border:0;">
        <label>Don’t fill this out if you’re human: <input name="bot-field" type="text"></label>
      </p>
      <input type="text" name="name">
      <input type="email" name="email">
      <input type="text" name="subject">
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
